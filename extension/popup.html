<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rebuild Strong → Vita</title>
<style>
  :root{--bg:#0d1013;--panel:#161a1f;--line:#242b34;--tx:#e6ebf2;--dim:#8a95a3;--main:#f0b429;--ok:#22c55e;--ko:#ef4444;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  body{margin:0;width:360px;background:var(--bg);color:var(--tx);font:13px/1.45 var(--sans)}
  h1{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
  h1 small{color:var(--dim);font-weight:400}
  .s{padding:10px 14px;border-bottom:1px solid var(--line)}
  label{display:block;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:8px 0 3px}
  input[type=text],textarea{width:100%;box-sizing:border-box;background:#0f1317;border:1px solid var(--line);color:var(--tx);
    border-radius:6px;padding:6px 7px;font:12px var(--mono)}
  textarea{height:74px;resize:vertical}
  .row{display:flex;gap:12px;margin-top:8px;color:var(--dim)}
  .row label{all:unset;display:flex;gap:5px;align-items:center;cursor:pointer}
  .btns{display:flex;gap:6px;margin-top:10px}
  button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px;font:600 12px var(--sans);cursor:pointer}
  button.pri{color:var(--main);border-color:rgba(240,180,41,.4)}
  #st{font:11px var(--mono);color:var(--dim);margin-top:8px;min-height:14px}
  ul{list-style:none;margin:0;padding:0;max-height:180px;overflow:auto}
  li{font:11px var(--mono);padding:5px 0;border-bottom:1px solid var(--line);color:var(--dim)}
  li b{color:var(--tx);font-weight:600}
  .ok{color:var(--ok)}.ko{color:var(--ko)}
  details summary{cursor:pointer;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<h1>Rebuild Strong → Vita <small>· BTWB</small></h1>
<div class="s">
  <label for="chatUrl">URL del chat de Vita (Grok)</label>
  <input type="text" id="chatUrl" placeholder="https://grok.com/">
  <div class="row">
    <label><input type="checkbox" id="autoSubmit"> Enviar automáticamente</label>
    <label><input type="checkbox" id="activate"> Traer Grok al frente</label>
  </div>
  <details>
    <summary>Selectores (si Grok cambia su HTML)</summary>
    <label for="inputSelectors">Campo de texto · uno por línea, en orden</label>
    <textarea id="inputSelectors"></textarea>
    <label for="sendSelectors">Botón enviar · uno por línea (si ninguno vale: Enter)</label>
    <textarea id="sendSelectors"></textarea>
  </details>
  <div class="btns">
    <button class="pri" id="save">Guardar</button>
    <button id="test">Enviar prueba</button>
    <button id="reset">Por defecto</button>
  </div>
  <div id="st"></div>
</div>
<div class="s">
  <label>Últimos envíos</label>
  <ul id="log"><li>—</li></ul>
</div>
<script src="popup.js"></script>
</body>
</html>
