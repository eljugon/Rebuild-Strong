<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="16W v13">
<meta name="theme-color" content="#050505">
<title>Programa 16 Semanas · v13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --panel:#131015; --panel2:#1a151c; --line:#2a232f;
  --ink:#f6f4f8; --mut:#a099a8; --dim:#5f5868;
  --pink:#e84ff5; --pinkink:#0a0a0a; --green:#8cff5a; --greenink:#08110a;
  --accent:var(--pink); --accentink:var(--pinkink);
  --b1:#4f8cff; --b2:#8cff5a; --b3:#e84ff5; --b4:#ff5c7a;
  --alactic:#ff5c7a; --wod:#e84ff5; --zone2:#f4c430; --lactic:#8cff5a; --vo2:#4f8cff; --skill:#9aa4b2;
  --topbar:64px; --safe:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:100px}
h1,h2,h3,.disp{font-family:'Poppins',sans-serif;letter-spacing:-.01em;margin:0}
.mono{font-family:'JetBrains Mono',monospace}

/* Topbar fija con safe-area (iOS PWA) */
#topbar{position:fixed;top:0;left:0;right:0;z-index:50;
  height:calc(var(--topbar) + var(--safe));padding-top:var(--safe);
  background:rgba(5,5,5,.88);backdrop-filter:saturate(150%) blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-left:14px;padding-right:14px}
#topbar .back{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:20px;display:none;align-items:center;justify-content:center;
  transition:transform .15s ease}
#topbar .back:active{transform:scale(.9)}
#topbar .title{font-family:'Poppins';font-size:19px;font-weight:800;line-height:1;letter-spacing:-.01em}
#topbar .title small{display:block;font-family:Inter;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mut);font-weight:600;margin-top:3px}
#topbar .ver{margin-left:auto;font-family:'JetBrains Mono';font-size:11px;color:var(--pink);
  border:1px solid rgba(232,79,245,.4);background:rgba(232,79,245,.08);border-radius:999px;padding:5px 10px;font-weight:700}
#spacer{height:calc(var(--topbar) + var(--safe))}

.wrap{max-width:640px;margin:0 auto;padding:14px}

/* Home */
.hero{padding:10px 2px 16px;position:relative}
.hero::before{content:'';position:absolute;top:-30px;left:-14px;right:-14px;height:220px;z-index:-1;
  background:radial-gradient(60% 100% at 30% 0%,rgba(232,79,245,.16) 0%,rgba(232,79,245,0) 70%)}
.hero h1{font-size:38px;line-height:.98;font-weight:900;text-transform:uppercase}
.hero p{color:var(--mut);font-size:13px;margin:10px 0 0;line-height:1.55}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.badge{font-size:10.5px;letter-spacing:.03em;color:var(--mut);border:1px solid var(--line);
  background:var(--panel);border-radius:999px;padding:5px 10px;font-weight:500}
.badge b{color:var(--green);font-family:'JetBrains Mono';font-weight:700}

.blocklegend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0 4px}
.bl{border:1px solid var(--line);border-radius:14px;padding:10px 8px;background:var(--panel);
  transition:transform .15s ease}
.bl:active{transform:scale(.96)}
.bl .n{font-family:'JetBrains Mono';font-size:10px;font-weight:700}
.bl .t{font-family:'Poppins';font-size:13.5px;font-weight:700;line-height:1.05;margin-top:4px}
.bl .w{font-size:9.5px;color:var(--dim);margin-top:3px}

.sec-label{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin:24px 2px 10px;font-weight:700}

.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wk{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--panel);
  padding:13px 8px 11px;text-align:center;cursor:pointer;overflow:hidden;transition:transform .15s ease}
.wk:active{transform:scale(.95)}
.wk .bar{position:absolute;top:0;left:0;right:0;height:3px}
.wk .num{font-family:'Poppins';font-size:24px;font-weight:800;line-height:1}
.wk .sub{font-size:9px;color:var(--mut);margin-top:3px;letter-spacing:.02em;font-weight:600}
.wk.test{border-color:var(--pink);box-shadow:0 0 0 1px rgba(232,79,245,.25),0 0 20px rgba(232,79,245,.15) inset}
.wk.test .num{color:var(--pink)}

/* Week view */
.wkhead{display:flex;align-items:baseline;gap:10px;margin:6px 2px 14px}
.wkhead .big{font-family:'Poppins';font-size:26px;font-weight:800}
.wkhead .blk{font-family:'JetBrains Mono';font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.days{display:flex;flex-direction:column;gap:9px}
.day{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;
  background:var(--panel);padding:13px 14px;cursor:pointer;transition:transform .15s ease}
.day:active{transform:scale(.98)}
.day .dot{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-family:'Poppins';font-weight:700;font-size:14px;flex:0 0 auto;border:1px solid var(--line)}
.day .nm{font-family:'Poppins';font-size:17px;font-weight:700;line-height:1}
.day .fo{font-size:11px;color:var(--mut);margin-top:4px}
.day .chev{margin-left:auto;color:var(--dim);font-size:20px}
.dpill{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* Session view */
.shead{margin:2px 2px 6px}
.shead .d{font-family:'Poppins';font-size:27px;font-weight:800;line-height:1}
.shead .s{font-size:11px;color:var(--mut);margin-top:4px}
.block{border:1px solid var(--line);border-radius:16px;background:var(--panel);margin-top:10px;overflow:hidden}
.block .bhead{display:flex;align-items:center;gap:10px;padding:13px 14px}
.block .kind{font-family:'JetBrains Mono';font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:6px;flex:0 0 auto}
.block .bn{font-family:'Poppins';font-size:15.5px;font-weight:700;line-height:1.15}
.block .body{padding:0 14px 13px}
.block .detail{font-size:13.5px;line-height:1.5;color:var(--ink)}
.block .note{font-size:12px;line-height:1.5;color:var(--mut);margin-top:7px;
  border-left:2px solid var(--line);padding-left:9px}
.block .bo{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.block .bench{margin-top:8px;font-size:11.5px;line-height:1.45;background:linear-gradient(90deg,rgba(140,255,90,.1),rgba(140,255,90,.03));
  border:1px solid rgba(140,255,90,.3);border-radius:10px;padding:9px 10px}
.block .bench b{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);display:block;margin-bottom:2px}
.block .bench span{color:var(--ink)}
.block .bo .li{font-family:'JetBrains Mono';font-size:11.5px;color:var(--ink);background:var(--panel2);
  border-radius:9px;padding:8px 10px;line-height:1.4}
.tag{font-size:9.5px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 7px;margin-left:auto;flex:0 0 auto;white-space:nowrap}
.block.test{border-color:var(--pink)}
.block.test .bn{color:var(--pink)}

/* kind colors */
.k-strength{background:#182242;color:#8fb3ff}
.k-oly{background:#391b45;color:#eaa6ff}
.k-cond{background:#182242;color:#a6c8f0}
.k-wod{background:#3d1240;color:#f2a0f7}
.k-strongman{background:#3d2515;color:#f0b48a}
.k-finisher{background:#123320;color:#8ff2b8}
.k-acc{background:#1c232c;color:#9fb6c8}
.k-warmup{background:#1a171d;color:#a099a8}
.k-mob{background:#1a171d;color:#a099a8}
.k-skill{background:#211d26;color:#c3b8ce}
.k-bw{background:#0f332c;color:#8fe0cd}
.k-home{background:#211d26;color:#c3b8ce}

/* mobility collapsible */
.mobtoggle{cursor:pointer}
.mobbody{display:none}
.mobbody.open{display:block}

/* floating export CTA */
#fab{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;
  transform:translateX(-50%);display:none;align-items:center;gap:8px;
  background:var(--green);color:var(--greenink);font-family:'JetBrains Mono';font-weight:700;
  font-size:12.5px;letter-spacing:.03em;padding:14px 24px;border-radius:999px;cursor:pointer;
  box-shadow:0 10px 30px rgba(140,255,90,.3),0 2px 10px rgba(0,0,0,.5);transition:transform .15s ease}
#fab:active{transform:translateX(-50%) scale(.94)}

/* export sheet */
#sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:none;align-items:flex-end}
#sheet.open{display:flex}
.sheetcard{background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;
  width:100%;max-width:640px;margin:0 auto;padding:16px 16px calc(20px + var(--safe));border-top:1px solid var(--line);max-height:80vh;display:flex;flex-direction:column}
.sheetcard h3{font-family:'Poppins';font-size:19px;font-weight:800}
.sheetcard .hint{font-size:11px;color:var(--mut);margin:4px 0 10px}
#btwbtext{flex:1;min-height:200px;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:14px;padding:12px;font-family:'JetBrains Mono';font-size:11.5px;line-height:1.5;resize:none}
.sheetrow{display:flex;gap:8px;margin-top:12px}
.sheetrow button{flex:1;padding:13px;border-radius:14px;font-family:'JetBrains Mono';font-weight:700;font-size:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.sheetrow .copy{background:var(--green);color:var(--greenink);border-color:var(--green)}
.foot{text-align:center;color:var(--dim);font-size:10.5px;margin-top:26px;line-height:1.6}
</style>
</head>
<body>
<div id="topbar">
  <button class="back" id="backbtn" onclick="goBack()">‹</button>
  <div class="title" id="tbtitle">16 SEMANAS<small>Fuerza · Acondicionamiento</small></div>
  <div class="ver">v13</div>
</div>
<div id="spacer"></div>
<div class="wrap" id="app"></div>

<div id="fab" onclick="openSheet()">⇪ Exportar a BTWB</div>

<div id="sheet" onclick="if(event.target.id==='sheet')closeSheet()">
  <div class="sheetcard">
    <h3>Exportar a BTWB</h3>
    <div class="hint">Copia y pega en Beyond The Whiteboard para registrar la sesión.</div>
    <textarea id="btwbtext" readonly></textarea>
    <div class="sheetrow">
      <button onclick="closeSheet()">Cerrar</button>
      <button class="copy" id="copybtn" onclick="copyBTWB()">Copiar</button>
    </div>
  </div>
</div>

const DAYABBR={LUN:"L",MAR:"M",MIE:"X",JUE:"J",VIE:"V",SAB:"S"};
const SYS={alactic:{c:"var(--alactic)",l:"Aláctico"},wod:{c:"var(--wod)",l:"WOD"},
  zone2:{c:"var(--zone2)",l:"Zona 2"},lactic:{c:"var(--lactic)",l:"Láctico"},
  vo2:{c:"var(--vo2)",l:"VO2 máx"},skill:{c:"var(--skill)",l:"Skill"},home:{c:"var(--skill)",l:"Casa"}};
const BLOCKC={1:"var(--b1)",2:"var(--b2)",3:"var(--b3)",4:"var(--b4)"};
const DAYFOCUS={LUN:"Sentadilla + Snatch + Dominada lastrada",MAR:"Clean & Jerk + Empuje + WOD",MIE:"Zona 2 · 45 min",
  JUE:"Peso muerto + Strongman + Láctico",VIE:"Banca + Front Squat + Fondo lastrado",SAB:"En casa · peso corporal"};
const DAYSYS={LUN:"alactic",MAR:"wod",MIE:"zone2",JUE:"lactic",VIE:"vo2",SAB:"home"};

let view={name:"home",wk:null,day:null};
const app=document.getElementById("app");
const tbtitle=document.getElementById("tbtitle");
const backbtn=document.getElementById("backbtn");
const fab=document.getElementById("fab");

function setTop(t,s){tbtitle.innerHTML=t+(s?`<small>${s}</small>`:"");}

function render(){
  window.scrollTo(0,0);
  if(view.name==="home") renderHome();
  else if(view.name==="week") renderWeek();
  else if(view.name==="session") renderSession();
  backbtn.style.display = view.name==="home" ? "none":"flex";
  fab.style.display = view.name==="session" ? "flex":"none";
}

function renderHome(){
  setTop("16 SEMANAS","Fuerza · Acondicionamiento · v13");
  const bl=[
    {n:"BLOQUE 1",t:"Estructural",w:"Sem 1–4 · GVT-lite",c:"--b1"},
    {n:"BLOQUE 2",t:"Tempo · TUT",w:"Sem 5–8 · tempo",c:"--b2"},
    {n:"BLOQUE 3",t:"Cluster",w:"Sem 9–12 · contraste",c:"--b3"},
    {n:"BLOQUE 4",t:"Pico · Test",w:"Sem 13–16",c:"--b4"},
  ];
  let h=`<div class="hero">
    <h1>PROGRAMA<br>CONJUGADO<br>POWERBUILDING</h1>
    <p>Metodología nueva vs. v11: el motor de progresión es rotación de método por bloque + autorregulación AHAFA/RPE. Cargas ancladas a tu log real de BTWB (ciclo Rebuild Strong).</p>
    <div class="badges">
      <span class="badge">SentT <b>150</b></span>
      <span class="badge">PMuerto <b>175</b></span>
      <span class="badge">Banca <b>120</b></span>
      <span class="badge">FrontSq <b>125</b></span>
      <span class="badge">PushPress <b>95</b></span>
      <span class="badge">P.Clean <b>92,5</b></span>
      <span class="badge">Jerk <b>90</b></span>
      <span class="badge">Snatch <b>75</b></span>
      <span class="badge">StrictP <b>72</b></span>
      <span class="badge">Dom.lastr <b>+37,5</b></span>
      <span class="badge">Fondo lastr <b>+45</b></span>
      <span class="badge">Pendlay <b>0,44×PM</b></span>
    </div>
  </div>
  <div class="blocklegend">`;
  bl.forEach(b=>{h+=`<div class="bl"><div style="height:3px;border-radius:2px;background:var(${b.c});margin:-9px -8px 8px"></div>
    <div class="n" style="color:var(${b.c})">${b.n}</div><div class="t">${b.t}</div><div class="w">${b.w}</div></div>`;});
  h+=`</div><div class="sec-label">Selecciona semana</div><div class="weeks">`;
  PROGRAM.forEach(w=>{
    const test=w.week>=15;
    h+=`<div class="wk ${test?'test':''}" onclick="openWeek(${w.week})">
      <div class="bar" style="background:${BLOCKC[w.block]}"></div>
      <div class="num">${w.week}</div>
      <div class="sub">${test?'TEST':'B'+w.block}</div></div>`;
  });
  h+=`</div><div class="foot">v13 · Conjugado-Powerbuilding<br>Cargas ancladas al log real de BTWB (ciclo Rebuild Strong, mar–jul 2026)<br>Test W15: SentT 150 · PMuerto 175 · Banca 120 · Secundarios: mejor top-set 2026 (Epley)</div>`;
  app.innerHTML=h;
}

function openWeek(wk){view={name:"week",wk:wk,day:null};render();}
function openSession(wk,day){view={name:"session",wk:wk,day:day};render();}
function goBack(){
  if(view.name==="session"){view={name:"week",wk:view.wk,day:null};}
  else if(view.name==="week"){view={name:"home",wk:null,day:null};}
  render();
}

function renderWeek(){
  const w=PROGRAM.find(x=>x.week===view.wk);
  setTop("SEMANA "+w.week, w.blockname);
  let h=`<div class="wkhead"><div class="big">Semana ${w.week}</div>
    <div class="blk" style="color:${BLOCKC[w.block]};border:1px solid ${BLOCKC[w.block]}44;background:${BLOCKC[w.block]}18">Bloque ${w.block} · ${w.blockname}</div></div>
    <div class="days">`;
  w.sessions.forEach(s=>{
    const sys=DAYSYS[s.day];
    h+=`<div class="day" onclick="openSession(${w.week},'${s.day}')">
      <div class="dot" style="color:${SYS[sys].c}">${DAYABBR[s.day]}</div>
      <div><div class="nm">${s.dayname}</div>
        <div class="fo"><span class="dpill" style="background:${SYS[sys].c}"></span>${DAYFOCUS[s.day]}</div></div>
      <div style="margin-left:auto;text-align:right"><div class="mono" style="font-size:13px;font-weight:700;color:var(--accent)">${s.total}'</div><div class="chev" style="margin:0">›</div></div></div>`;
  });
  h+=`</div>`;
  app.innerHTML=h;
}

function kindLabel(k){
  return {strength:"Fuerza",oly:"Olímpico",cond:"Cardio",wod:"WOD",strongman:"Strongman",
    finisher:"Finisher",acc:"Accesorio",warmup:"Calent.",mob:"Movilidad",skill:"Skill",bw:"Peso corp."}[k]||k;
}

function renderSession(){
  const w=PROGRAM.find(x=>x.week===view.wk);
  const s=w.sessions.find(x=>x.day===view.day);
  setTop(s.dayname.toUpperCase(),"Semana "+w.week+" · Bloque "+w.block);
  let h=`<div class="shead"><div class="d">${s.dayname}</div>
    <div class="s">Semana ${w.week} · ${w.blockname} · <span style="color:${SYS[DAYSYS[s.day]].c}">${DAYFOCUS[s.day]}</span></div>
    <div class="s" style="margin-top:6px"><span class="mono" style="color:var(--green);font-weight:700">⏱ ${s.total} min totales</span> <span style="color:var(--dim)">· incl. calentamiento y movilidad</span></div></div>`;
  s.blocks.forEach((b,i)=>{
    const isTest=b.is_test;
    const collaps=(b.kind==="mob");
    const sysc = b.sys ? SYS[b.sys].c : null;
    h+=`<div class="block ${isTest?'test':''}">
      <div class="bhead ${collaps?'mobtoggle':''}" ${collaps?`onclick="toggleMob(${i})"`:''}>
        <span class="kind k-${b.kind}">${kindLabel(b.kind)}</span>
        <span class="bn">${b.n}</span>
        ${b.min?`<span class="mono" style="font-size:10px;color:var(--dim);flex:0 0 auto">${b.min}'</span>`:""}
        ${b.tag?`<span class="tag">${b.tag}</span>`:(sysc?`<span class="tag" style="color:${sysc};border-color:${sysc}55">${SYS[b.sys].l}</span>`:"")}
        ${collaps?`<span class="tag" id="mobchev${i}">▾</span>`:""}
      </div>`;
    if(collaps){
      h+=`<div class="body mobbody" id="mobbody${i}"><div class="detail">${b.t}</div></div>`;
    }else{
      h+=`<div class="body"><div class="detail">${b.t}</div>`;
      if(b.note) h+=`<div class="note">${b.note}</div>`;
      if(b.bo&&b.bo.length){h+=`<div class="bo">`;b.bo.forEach(x=>h+=`<div class="li">↳ ${x}</div>`);h+=`</div>`;}
      if(b.bench){h+=`<div class="bench"><b>Tu marca · BTWB</b><span>${b.bench}</span></div>`;}
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  app.innerHTML=h;
}

function toggleMob(i){
  document.getElementById("mobbody"+i).classList.toggle("open");
  const c=document.getElementById("mobchev"+i); if(c) c.textContent = c.textContent==="▾"?"▴":"▾";
}

/* export sheet */
function openSheet(){
  const w=PROGRAM.find(x=>x.week===view.wk);
  const s=w.sessions.find(x=>x.day===view.day);
  document.getElementById("btwbtext").value=s.btwb;
  document.getElementById("sheet").classList.add("open");
}
function closeSheet(){document.getElementById("sheet").classList.remove("open");}
function copyBTWB(){
  const t=document.getElementById("btwbtext");
  t.select();t.setSelectionRange(0,99999);
  const btn=document.getElementById("copybtn");
  try{
    navigator.clipboard.writeText(t.value).then(()=>{btn.textContent="¡Copiado!";setTimeout(()=>btn.textContent="Copiar",1400);});
  }catch(e){document.execCommand("copy");btn.textContent="¡Copiado!";setTimeout(()=>btn.textContent="Copiar",1400);}
}

render();

/* service worker para uso offline (PWA) */
if("serviceWorker" in navigator){
  const sw=`self.addEventListener("install",e=>self.skipWaiting());
  self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));
  self.addEventListener("fetch",e=>{e.respondWith(
    caches.open("p16w-v13").then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{
      if(e.request.method==="GET"&&e.request.url.startsWith("http"))c.put(e.request,res.clone());return res;
    }).catch(()=>c.match("/")))));});`;
  const blob=new Blob([sw],{type:"text/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
