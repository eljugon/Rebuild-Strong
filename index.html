<title>Programa 16 Semanas · v14</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230d1013'/%3E%3Ctext x='90' y='118' font-size='84' font-family='ui-monospace,monospace' font-weight='700' fill='%23f0b429' text-anchor='middle'%3E14%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d1013; --panel:#161a1f; --panel2:#1b2027; --line:#242b34;
  --tx:#e6ebf2; --dim:#8a95a3; --dim2:#5f6a78;
  --main:#f0b429; --oly:#a78bfa; --str:#60a5fa; --acc:#94a3b8;
  --bw:#5eead4; --strong:#fb923c; --wod:#f472b6; --fin:#c084fc;
  --alactic:#ef4444; --lactic:#f59e0b; --vo2:#22c55e; --z2:#3b82f6;
  --warm:#4b5563;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --top:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
  font-size:15px;line-height:1.5;overscroll-behavior-y:none}
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(13,16,19,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);}
.topbar-in{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px}
.back{font-size:22px;line-height:1;color:var(--main);background:none;border:0;padding:4px 8px 6px 0;cursor:pointer;font-family:var(--mono)}
.tt{font-size:14px;font-weight:600;letter-spacing:.01em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver{font-family:var(--mono);font-size:11px;color:var(--dim2);border:1px solid var(--line);
  border-radius:5px;padding:2px 6px}
.spacer{height:calc(var(--top) + env(safe-area-inset-top))}
.wrap{padding:0 14px calc(48px + env(safe-area-inset-bottom))}
h1{font-size:22px;line-height:1.2;margin:18px 0 6px;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:13px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--panel2)}
.pad{padding:13px 14px}

/* ── home ── */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.badge{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:4px 7px}
.badge b{color:var(--main);font-weight:600}
.sec{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2);
  margin:22px 0 9px;font-weight:600}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 6px;
  text-align:center;cursor:pointer;position:relative}
.wk:active{background:var(--panel2)}
.wk .n{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1}
.wk .b{font-family:var(--mono);font-size:9px;color:var(--dim2);margin-top:4px;letter-spacing:.04em}
.wk .bar{position:absolute;left:0;right:0;top:0;height:3px;border-radius:10px 10px 0 0}
.wk.done .n{color:var(--vo2)}
.b1{background:var(--str)}.b2{background:var(--bw)}.b3{background:var(--fin)}.b4{background:var(--main)}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim)}
.legend div{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}

/* ── día ── */
.dayrow{display:flex;align-items:center;gap:12px;padding:13px 14px}
.dcode{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim2);
  width:32px;flex:0 0 auto;letter-spacing:.06em}
.dmain{flex:1;min-width:0}
.dname{font-size:15px;font-weight:600;margin-bottom:2px}
.dfocus{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmeta{text-align:right;flex:0 0 auto}
.dmin{font-family:var(--mono);font-size:15px;font-weight:600}
.dblk{font-family:var(--mono);font-size:10px;color:var(--dim2)}
.chk{color:var(--vo2);font-size:13px}

/* ── presupuesto de tiempo (firma) ── */
.budget{padding:14px 14px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.blabel{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.btot{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.02em}
.btot span{font-size:12px;color:var(--dim2);font-weight:400}
.bcap{font-family:var(--mono);font-size:11px;color:var(--dim2)}
.track{display:flex;height:10px;border-radius:3px;overflow:hidden;background:#0a0d10;gap:1px}
.seg{height:100%}
.ticks{position:relative;height:14px;margin-top:5px}
.tick{position:absolute;top:0;font-family:var(--mono);font-size:9px;color:var(--dim2);transform:translateX(-50%)}
.tick:before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:4px;background:var(--line)}

/* ── bloques ── */
.blk{border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.bhead{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.kind{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;
  padding:3px 6px;border-radius:4px;flex:0 0 auto;text-transform:uppercase}
.bn{font-size:14px;font-weight:600;flex:1;min-width:0;line-height:1.35}
.bmin{font-family:var(--mono);font-size:11px;color:var(--dim2);flex:0 0 auto}
.bt{padding:0 14px 6px;white-space:pre-wrap;font-size:14px;color:#cfd7e2;line-height:1.55}
.bt em{font-style:normal;font-family:var(--mono);color:var(--main)}
.bo{padding:4px 14px 4px 26px;font-size:13px;color:#b6c0cd;position:relative}
.bo:before{content:"↳";position:absolute;left:12px;color:var(--dim2)}
.note{margin:8px 14px 13px;padding:9px 11px;background:var(--panel2);border-left:2px solid var(--line);
  border-radius:0 6px 6px 0;font-size:12.5px;color:var(--dim);white-space:pre-wrap;line-height:1.5}
.tag{font-family:var(--mono);font-size:9px;color:var(--dim2);border:1px solid var(--line);
  border-radius:4px;padding:2px 5px;flex:0 0 auto}

.k-main{background:rgba(240,180,41,.15);color:var(--main)}
.k-oly{background:rgba(167,139,250,.15);color:var(--oly)}
.k-str{background:rgba(96,165,250,.15);color:var(--str)}
.k-acc{background:rgba(148,163,184,.14);color:var(--acc)}
.k-bw{background:rgba(94,234,212,.14);color:var(--bw)}
.k-strong{background:rgba(251,146,60,.15);color:var(--strong)}
.k-wod{background:rgba(244,114,182,.15);color:var(--wod)}
.k-finisher{background:rgba(192,132,252,.15);color:var(--fin)}
.k-home{background:rgba(148,163,184,.12);color:var(--acc)}
.k-warmup,.k-mob{background:rgba(75,85,99,.25);color:#9aa5b1}
.k-cond{background:rgba(148,163,184,.14);color:var(--acc)}
.s-alactic{background:rgba(239,68,68,.16);color:var(--alactic)}
.s-lactic{background:rgba(245,158,11,.16);color:var(--lactic)}
.s-vo2{background:rgba(34,197,94,.16);color:var(--vo2)}
.s-z2{background:rgba(59,130,246,.16);color:var(--z2)}

.actions{display:flex;gap:8px;margin:14px 0 0}
.btn{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.btn:active{background:var(--panel2)}
.btn.pri{background:rgba(240,180,41,.12);border-color:rgba(240,180,41,.35);color:var(--main)}
.btn.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35);color:var(--vo2)}
.foot{color:var(--dim2);font-size:11px;text-align:center;margin:26px 0 0;line-height:1.7;font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:9px;
  font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}
</style>
</head>

<script>
const P = [{"week":1,"block":1,"blocklabel":"B1 · Estructural","sessions":[{"day":"LUN","dayname":"Lunes","focus":"Sentadilla · Empuje vertical · Anaeróbico","blocks":[{"kind":"warmup","n":"Calentamiento","t":"5' bici suave + movilidad de tobillo y cadera (90/90, sentadilla profunda sostenida 60\") + 2×10 air squats + 2×8 band pull-apart + rampa vacía de sentadilla","min":8},{"kind":"main","n":"Back Squat · Estructural","t":"Top set: 5 reps AHAFA (RPE 8) · guía 120 kg (80%)\nTempo 30X1. Sube en rampa: 5@50% · 5@65% · 3@75% · top set.","min":18,"note":"Si el top set sale a RPE ≤7, súbelo 2,5–5 kg. El back-off es el estímulo, no lo recortes.","bo":["Back-off GVT-lite 8×8 @ 90 kg (60%) · descanso 60\" · tempo 30X1"],"tag":"AHAFA"},{"kind":"acc","n":"Unilateral · dominante cadera · Peso muerto rumano a una pierna con mancuernas","t":"4×8+8 · 2×12,5 kg · tempo 3011 · descanso 75\"","min":8,"note":"Balance de cadena posterior a una pierna. Empieza siempre por el lado débil e iguala repeticiones.","tag":"UNI"},{"kind":"str","n":"Strict Press · Estructural","t":"Top set 5 reps AHAFA · guía 57,5 kg (80%)\nBack-off 4×8 @ 42,5 kg (60%) · descanso 75\"","min":11,"note":"Glúteo y abdomen apretados, sin arqueo lumbar. Codos por delante de la barra en el inicio.","tag":"AHAFA"},{"kind":"str","n":"Dominada estricta lastrada · Estructural","t":"Top set 5 reps AHAFA · guía +25 kg\nBack-off 4×8 con +12,5 kg · descanso 75\" · tempo 30X1","min":9,"note":"Escápula deprimida antes de tirar. Si el back-off baja de 8, quita 2,5 kg.","tag":"AHAFA"},{"kind":"cond","n":"Anaeróbico aláctico · Intervalos","t":"10×10\" Assault Bike máximo / 50\" descanso completo","min":10,"note":"Objetivo 9–10 cal por intervalo. Si bajas de 8 cal, corta la serie.\nTu marca · BTWB: Assault Bike ≈9–10 cal/10\".","tag":"ALÁCTICO","sys":"alactic"},{"kind":"finisher","n":"Finisher · Tríceps · Drop set de extensión en polea","t":"1×12 @ carga fuerte → drop 25% → 1×máx → drop 25% → 1×máx · 3 rondas · descanso 90\"","min":5,"note":"Finisher de culturismo: la última repetición debe costar, pero sin fallo técnico.","tag":"FIN"},{"kind":"mob","n":"Movilidad post-sesión","t":"Cadera: pigeon 90\" por lado + estiramiento de psoas en zancada 90\" por lado","min":5,"note":"Referencias: Pliability / GoWOD / The Ready State."}],"total":74,"work":6},{"day":"MAR","dayname":"Martes","focus":"Clean & Jerk · Empuje horizontal · WOD","blocks":[{"kind":"warmup","n":"Calentamiento","t":"5' remo suave + movilidad torácica y de muñeca + 2×10 barra vacía (clean pull + front rack) + 10 band pull-apart + 5 push press con barra vacía","min":8},{"kind":"oly","n":"Olímpico · Power Clean + Push Jerk","t":"6 series de (2 power clean + 1 push jerk) · ~68% · 62,5 kg guía de cargada / 60 kg guía de jerk · descanso 2:00 entre series","min":18,"note":"Todas las series incluyen un jerk real. Recepción firme y extensión completa antes de bajar.","tag":"C&J"},{"kind":"main","n":"Bench Press · Estructural","t":"Top set: 5 reps AHAFA (RPE 8) · guía 95 kg (80%)\nTempo 30X1. Sube en rampa: 5@50% · 5@65% · 3@75% · top set.","min":14,"note":"Si el top set sale a RPE ≤7, súbelo 2,5–5 kg. El back-off es el estímulo, no lo recortes.","bo":["Back-off GVT-lite 6×8 @ 72,5 kg (60%) · descanso 60\" · tempo 30X1"],"tag":"AHAFA"},{"kind":"acc","n":"Pendlay Row · Estructural","t":"5×8 @ 60 kg (67,5%) · barra muerta en el suelo cada rep · descanso 90\"","min":8,"note":"Ancla: 0,50 × peso muerto (87,5 kg). Torso paralelo al suelo, sin impulso de cadera.","tag":"ESTR"},{"kind":"wod","n":"WOD CrossFit · AMRAP 14'","t":"12 thrusters con barra 42,5 kg\n9 dominadas pecho-barra\n6 burpees sobre barra","min":14,"note":"Todas las cargas están prescritas en kg. Si escalas, anota la carga real usada en BTWB.","tag":"WOD"},{"kind":"finisher","n":"Finisher · Trapecio/Deltoides · Encogimientos con barra + pausa","t":"5×12 @ 105 kg · 2\" de pausa arriba · descanso 90\"","min":5,"note":"Finisher de culturismo: la última repetición debe costar, pero sin fallo técnico.","tag":"FIN"},{"kind":"mob","n":"Movilidad post-sesión","t":"Torácica: extensión sobre foam roller 2' + open book 10+10","min":5,"note":"Referencias: Pliability / GoWOD / The Ready State."}],"total":72,"work":5},{"day":"MIE","dayname":"Miércoles","focus":"Zona 2","blocks":[{"kind":"warmup","n":"Calentamiento","t":"5' progresivo de la modalidad del día (carrera o Bike Erg) subiendo pulsaciones hasta Zona 2","min":5},{"kind":"cond","n":"Zona 2 · Carrera continua","t":"45' de carrera continua en Zona 2 · pulsaciones 130–142 ppm · debes poder hablar en frases completas\nRitmo orientativo: 5:40–6:10 min/km en llano.","min":45,"note":"Solo carrera o Bike Erg en esta sesión: nada de remo ni Ski Erg.","tag":"Z2","sys":"z2"},{"kind":"mob","n":"Movilidad post-sesión","t":"Tobillo: dorsiflexión contra pared 90\" por lado + soleo en escalón 60\" por lado","min":8,"note":"Referencias: Pliability / GoWOD / The Ready State."}],"total":58,"work":1},{"day":"JUE","dayname":"Jueves","focus":"Peso muerto · Tracción · VO2 máx","blocks":[{"kind":"warmup","n":"Calentamiento","t":"5' remo suave + bisagra de cadera con PVC + 2×10 good morning con barra vacía + 10 hollow rocks + rampa de peso muerto","min":8},{"kind":"main","n":"Deadlift · Estructural","t":"Top set: 5 reps AHAFA (RPE 8) · guía 140 kg (80%)\nTempo 30X1. Sube en rampa: 5@50% · 5@65% · 3@75% · top set.","min":18,"note":"Si el top set sale a RPE ≤7, súbelo 2,5–5 kg. El back-off es el estímulo, no lo recortes.","bo":["Back-off GVT-lite 8×8 @ 105 kg (60%) · descanso 60\" · tempo 30X1"],"tag":"AHAFA"},{"kind":"str","n":"Fondo estricto lastrado · Estructural","t":"Top set 5 reps AHAFA · guía +32,5 kg\nBack-off 4×8 con +15 kg · descanso 75\" · tempo 30X1","min":9,"note":"Profundidad completa: hombro por debajo del codo en cada repetición.","tag":"AHAFA"},{"kind":"bw","n":"Tracción · peso corporal","t":"EMOM 10': impares 6 dominadas estrictas · pares 8 remos invertidos en anillas (pies elevados 40 cm)","min":9,"note  post-sesión","t":"Tobillo: dorsiflexión contra pared 90\" por lado + soleo en escalón 60\" por lado","min":5,"note":"Referencias: Pliability / GoWOD / The Ready State."}],"total":74,"work":6},{"day":"VIE","dayname":"Viernes","focus":"Snatch · Front Squat · Strongman · GPP","blocks":[{"kind":"warmup","n":"Calentamiento","t":"5' bici suave + movilidad de hombro y muñeca + 2×10 snatch grip pass-through + overhead squat con barra vacía 2×5","min":7},{"kind":"oly","n":"Snatch · TEST 1RM","t":"Rampa: 3@50% · 2@65% · 1@75% · 1@85% · 1@75 kg (marca actual) · luego +2,5 kg por intento\nMáximo 3 intentos por encima de 75 kg.","min":15,"note":"Referencia entrando: 75 kg.","tag":"TEST"},{"kind":"main","n":"Front Squat · TEST 1RM","t":"TEST 1RM · Rampa: 5@40% · 3@55% · 2@70% · 1@80% · 1@87,5% · 1@92,5% · 1@125 kg (1RM actual) · luego +2,5–5 kg por intento\nDescanso 3–5' entre intentos desde el 80%. Máximo 3 intentos por encima del 1RM actual.","min":13,"note":"1RM de referencia entrando: 125 kg. Corta ante el primer fallo técnico.","tag":"TEST"},{"kind":"strong","n":"Strongman · D-Ball ladder","t":"3 rondas ligeras del patrón de la semana, al 60% de la carga habitual · calidad de agarre y postura","min":8,"note":"Sin yoke ni Husafell disponibles: sustituidos por front rack carry y D-Ball. Agarre sin straps.","tag":"STRONG"},{"kind":"bw","n":"Empuje · peso corporal","t":"3 rondas fáciles: 10 flexiones + 6 fondos + 20\" handstand hold · sin acercarse al fallo","min":8,"note":"Empuje vertical y horizontal con peso corporal: flexiones, fondos y HSPU. Separado del fondo lastrado del jueves.","tag":"BW"},{"kind":"wod","n":"GPP WOD · Descarga","t":"3 rondas fáciles\n200 m carrera\n10 goblet squats 20 kg\n10 flexiones\n· al 70%","min":12,"tag":"TAPER"},{"kind":"finisher","n":"Finisher · Bíceps · Curl martillo Super 7","t":"2 rondas ligeras del patrón, sin llegar al fallo · bombeo y calidad de contracción","min":5,"note":"Finisher de culturismo: la última repetición debe costar, pero sin fallo técnico.","tag":"FIN"},{"kind":"mob","n":"Movilidad post-sesión","t":"Hombro: dislocaciones con banda 2×15 + estiramiento en puerta 90\" por lado","min":5,"note":"Referencias: Pliability / GoWOD / The Ready State."}],"total":73,"work":6},{"day":"SAB","dayname":"Sábado","focus":"En casa · peso corporal","blocks":[{"kind":"warmup","n":"Calentamiento","t":"3' de movilidad articular general + 20 air squats + 10 flexiones + 10 rotaciones de hombro","min":5},{"kind":"home","n":"WOD en casa · 3 rondas fáciles (descarga)","t":"15 zancadas alternas\n12 flexiones\n30\" plancha\n· ritmo cómodo, semana de test","min":22,"note":"Sin material. Suelo y espacio para tumbarte, nada más.","tag":"CASA"},{"kind":"mob","n":"Movilidad","t":"Hombro: dislocaciones con banda 2×15 + estiramiento en puerta 90\" por lado + 5' de respiración nasal tumbado","min":8}],"total":35,"work":1}]}];
const KL = {main:"Básico",oly:"Olímpico",str:"Fuerza",acc:"Accesorio",bw:"Peso corp.",
  strong:"Strongman",wod:"WOD",finisher:"Finisher",cond:"Cardio",warmup:"Calent.",mob:"Movilidad",home:"Casa"};
const SL = {alactic:"Aláctico",lactic:"Láctico",vo2:"VO2 máx",z2:"Zona 2"};
const CAP = 75;

let done = {};
try{ done = JSON.parse(localStorage.getItem("p16w-v14")||"{}"); }catch(e){ done = {}; }
const save = ()=>{ try{ localStorage.setItem("p16w-v14", JSON.stringify(done)); }catch(e){} };
const key = (w,d)=> w+"-"+d;

const app=document.getElementById("app"), tt=document.getElementById("tt"), back=document.getElementById("back");
let view={v:"home"};

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("on"),1700);}

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function hi(s){return esc(s).replace(/(\d+(?:,\d+)?\s?kg|\+\d+(?:,\d+)?\s?kg|\d+(?:,\d+)?%)/g,"<em>$1</em>");}

function segColor(b){
  if(b.kind==="cond"&&b.sys) return "var(--"+b.sys+")";
  if(b.kind==="warmup"||b.kind==="mob") return "var(--warm)";
  return "var(--"+(b.kind==="home"?"acc":b.kind==="cond"?"acc":b.kind)+")";
}

/* ─────────── HOME ─────────── */
function home(){
  tt.textContent="Programa 16 Semanas"; back.style.display="none";
  const total=96, ndone=Object.keys(done).length;
  let h=`<h1>Conjugado-Powerbuilding</h1>
  <p class="sub">16 semanas · 6 sesiones por semana · tope de 75 minutos en gimnasio.<br>
  Cargas ancladas a tu log real de BTWB (ciclo Rebuild Strong, mar–jul 2026).</p>
  <div class="badges">
    <span class="badge">SentT <b>150</b></span><span class="badge">PMuerto <b>175</b></span>
    <span class="badge">Banca <b>120</b></span><span class="badge">FrontSq <b>125</b></span>
    <span class="badge">PushPress <b>95</b></span><span class="badge">P.Clean <b>92,5</b></span>
    <span class="badge">Jerk <b>90</b></span><span class="badge">Snatch <b>75</b></span>
    <span class="badge">StrictP <b>72</b></span><span class="badge">Dom.lastr <b>+37,5</b></span>
    <span class="badge">Fondo lastr <b>+45</b></span><span class="badge">Pendlay <b>0,50×PM</b></span>
  </div>
  <div class="sec">Progreso · ${ndone} de ${total} sesiones</div>
  <div class="track" style="margin-bottom:4px"><div class="seg" style="width:${ndone/total*100}%;background:var(--vo2)"></div></div>
  <div class="sec">Semanas</div><div class="wgrid">`;
  P.forEach(w=>{
    const dn=w.sessions.filter(s=>done[key(w.week,s.day)]).length;
    h+=`<div class="wk ${dn===6?"done":""}" data-w="${w.week}">
      <div class="bar b${w.block}"></div>
      <div class="n">${w.week}</div><div class="b">${dn}/6</div></div>`;
  });
  h+=`</div>
  <div class="sec">Bloques</div>
  <div class="card"><div class="pad legend">
    <div><span class="dot b1"></span>B1 · Estructural (1–4) · top set AHAFA + back-off GVT-lite</div>
    <div><span class="dot b2"></span>B2 · Tempo/TUT (5–8) · 40X1–50X1 + estiramiento cargado</div>
    <div><span class="dot b3"></span>B3 · Cluster/Contraste (9–12) · double progressive plateau + PAP</div>
    <div><span class="dot b4"></span>B4 · Pico/Realización (13–14) · taper 15 · TEST 1RM 16</div>
  </div></div>
  <div class="sec">Sistemas energéticos</div>
  <div class="card"><div class="pad legend">
    <div><span class="dot" style="background:var(--alactic)"></span>Aláctico · lunes de semana impar</div>
    <div><span class="dot" style="background:var(--lactic)"></span>Láctico · lunes de semana par</div>
    <div><span class="dot" style="background:var(--z2)"></span>Zona 2 · miércoles (carrera o Bike Erg)</div>
    <div><span class="dot" style="background:var(--vo2)"></span>VO2 máx · jueves</div>
  </div></div>
  <div class="foot">v14 · Conjugado-Powerbuilding<br>
  Test W15 Rebuild Strong: SentT 150 · PMuerto 175 · Banca 120<br>
  Secundarios: mejor top-set 2026 (Epley)</div>`;
  app.innerHTML=h;
  app.querySelectorAll(".wk").forEach(e=>e.onclick=()=>go({v:"week",w:+e.dataset.w}));
  window.scrollTo(0,0);
}

/* ─────────── SEMANA ─────────── */
function week(n){
  const w=P[n-1];
  tt.textContent=`Semana ${n} · ${w.blocklabel}`; back.style.display="block";
  let h=`<h1>Semana ${n}</h1><p class="sub">${w.blocklabel}</p>`;
  w.sessions.forEach(s=>{
    const d=done[key(n,s.day)];
    h+=`<div class="card tap" data-d="${s.day}"><div class="dayrow">
      <div class="dcode">${s.day}</div>
      <div class="dmain"><div class="dname">${s.dayname} ${d?'<span class="chk">✓</span>':""}</div>
        <div class="dfocus">${esc(s.focus)}</div></div>
      <div class="dmeta"><div class="dmin">${s.total}'</div><div class="dblk">${s.work} bloques</div></div>
    </div></div>`;
  });
  app.innerHTML=h;
  app.querySelectorAll(".card").forEach(e=>e.onclick=()=>go({v:"sess",w:n,d:e.dataset.d}));
  window.scrollTo(0,0);
}

/* ─────────── SESIÓN ─────────── */
function sess(n,day){
  const w=P[n-1], s=w.sessions.find(x=>x.day===day);
  tt.textContent=`S${n} · ${s.dayname}`; back.style.display="block";
  const k=key(n,day), isDone=!!done[k];

  let segs="", ticks="";
  s.blocks.forEach(b=>{ segs+=`<div class="seg" style="width:${b.min/CAP*100}%;background:${segColor(b)}"></div>`; });
  if(s.total<CAP) segs+=`<div class="seg" style="flex:1"></div>`;
  [0,25,50,75].forEach(t=>{ ticks+=`<div class="tick" style="left:${t/CAP*100}%">${t}'</div>`; });

  let h=`<div class="card"><div class="budget">
    <div class="blabel"><div class="btot">${s.total}<span>′ · ${s.work} bloques</span></div>
      <div class="bcap">tope ${CAP}′ · margen ${CAP-s.total}′</div></div>
    <div class="track">${segs}</div><div class="ticks">${ticks}</div>
  </div>`;

  s.blocks.forEach(b=>{
    const kc = (b.kind==="cond"&&b.sys) ? "s-"+b.sys : "k-"+b.kind;
    const kt = (b.kind==="cond"&&b.sys) ? SL[b.sys] : (KL[b.kind]||b.kind);
    h+=`<div class="blk"><div class="bhead">
      <span class="kind ${kc}">${kt}</span><span class="bn">${esc(b.n)}</span>
      ${b.tag?`<span class="tag">${esc(b.tag)}</span>`:""}
      <span class="bmin">${b.min}′</span></div>
      <div class="bt">${hi(b.t)}</div>`;
    (b.bo||[]).forEach(x=>{ h+=`<div class="bo">${hi(x)}</div>`; });
    if(b.note) h+=`<div class="note">${esc(b.note)}</div>`;
    h+=`</div>`;
  });

  h+=`</div><div class="actions">
    <button class="btn ${isDone?"ok":""}" id="mk">${isDone?"✓ Hecha":"Marcar hecha"}</button>
    <button class="btn pri" id="ex">Copiar para BTWB</button>
  </div>`;
  app.innerHTML=h;

  document.getElementById("mk").onclick=e=>{
    if(done[k]){ delete done[k]; } else { done[k]=1; }
    save(); sess(n,day);
  };
  document.getElementById("ex").onclick=()=>{
    const code=`P14W${String(n).padStart(2,"0")}S${["LUN","MAR","MIE","JUE","VIE","SAB"].indexOf(day)+1}`;
    let t=`${code} · Semana ${n} · ${s.dayname} · ${w.blocklabel} · ${s.total}'\n\n`;
    s.blocks.forEach(b=>{
      if(b.kind==="warmup"||b.kind==="mob") return;
      t+=`[${b.min}'] ${b.n}\n${b.t}\n`;
      (b.bo||[]).forEach(x=>t+=`  - ${x}\n`);
      t+=`\n`;
    });
    const ok=()=>toast("Copiado. Pégalo en las notas de BTWB.");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(ok).catch(()=>fallback(t,ok));
    } else fallback(t,ok);
  };
  window.scrollTo(0,0);
}
function fallback(t,ok){
  const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";
  document.body.appendChild(a);a.select();
  try{document.execCommand("copy");ok();}catch(e){toast("No se pudo copiar en este navegador.");}
  document.body.removeChild(a);
}

/* ─────────── router ─────────── */
function go(v,push=true){
  view=v;
  if(push) history.pushState(v,"","#"+(v.v==="home"?"":v.v==="week"?"w"+v.w:"w"+v.w+"-"+v.d));
  render();
}
function render(){
  if(view.v==="home") home();
  else if(view.v==="week") week(view.w);
  else sess(view.w,view.d);
}
back.onclick=()=>history.back();
window.onpopstate=e=>{ view=e.state||{v:"home"}; render(); };

(function boot(){
  const m=(location.hash||"").replace("#","");
  if(/^w\d+-[A-Z]{3}$/.test(m)){const[a,b]=m.slice(1).split("-");view={v:"sess",w:+a,d:b};}
  else if(/^w\d+$/.test(m)) view={v:"week",w:+m.slice(1)};
  else view={v:"home"};
  history.replaceState(view,"","");
  render();
})();

  background_color:"#0d1013",theme_color:"#0d1013",
  icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230d1013'/%3E%3Ctext x='256' y='336' font-size='240' font-family='monospace' font-weight='700' fill='%23f0b429' text-anchor='middle'%3E14%3C/text%3E%3C/svg%3E",
    sizes:"512x512",type:"image/svg+xml"}]};
const l=document.createElement("link");l.rel="manifest";
l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
document.head.appendChild(l);

/* offline: la app es un único fichero sin recursos externos.
   Si se sirve desde un dominio, se intenta registrar un service worker; si no, se ignora. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
